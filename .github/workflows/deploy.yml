# Builds the Astro site with Deno and publishes dist/ to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
# For more information see: https://docs.astro.build/en/guides/deploy/github/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project dependencies
        run: deno install

      - name: Build site
        run: deno task build
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing (and the other IndexNow engines: Yandex, Seznam, Naver, Yep) to recrawl every page
  # in the sitemap. The key is the file public/941bb3b2062ec549708924f168e50f9f.txt. Google ignores IndexNow; it reads the sitemap.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://geminii.browning.edu
      INDEXNOW_KEY: 941bb3b2062ec549708924f168e50f9f
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(curl -fsS "$SITE/sitemap-0.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          echo "Submitting: $urls"
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"${SITE#https://}\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$SITE/$INDEXNOW_KEY.txt\",\"urlList\":$urls}" \
            -w 'IndexNow HTTP %{http_code}\n'
